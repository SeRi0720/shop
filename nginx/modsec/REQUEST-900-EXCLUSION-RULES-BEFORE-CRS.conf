# Ngoại lệ chạy TRƯỚC khi CRS nạp luật. Mỗi ngoại lệ phải có một hàng ở Phụ lục F.

# Ngoại lệ 1: Host là IP máy ảo nên 920350 khớp mọi request.
SecRule REQUEST_HEADERS:Host "@rx ^192\.168\.99\.144(:\d+)?$" \
    "id:1000001,phase:1,pass,nolog,ctl:ruleRemoveById=920350"

# Ngoại lệ 2: mật khẩu không vào SQL/HTML (argon2); tránh ghi mật khẩu vào audit log.
SecRule REQUEST_URI "@rx ^/api/auth/(login|register)$" \
    "id:1000002,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password"