# Phần dùng chung cho mọi location proxy tới backend. KHÔNG chứa proxy_pass:
# mỗi location tự chọn upstream (backend cho HTTP, backend_ws cho WebSocket), xem conf.d/shop.conf.
proxy_http_version 1.1;
proxy_hide_header X-Content-Type-Options;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_connect_timeout 2s;
# Thử lại (proxy_next_upstream): dùng mặc định `error timeout`, đủ khi backend chết (kết nối bị từ chối hoặc quá
# proxy_connect_timeout thì request chưa gửi đi nên sang backend còn lại, kể cả POST). Đã thử thêm http_502 http_503
# ở T3: không đổi kết quả đo. KHÔNG bật non_idempotent: POST /cart/items cộng dồn số lượng nên retry sẽ cộng đôi.