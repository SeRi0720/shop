# Phần dùng chung cho mọi location proxy tới backend. KHÔNG chứa proxy_pass:
# mỗi location tự chọn upstream (backend cho HTTP, backend_ws cho WebSocket), xem conf.d/shop.conf.
proxy_http_version 1.1;
proxy_hide_header X-Content-Type-Options;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_connect_timeout 2s;
# Nếu bạn đang giữ 3 dòng proxy_next_upstream* từ bước 2, dán chúng vào cuối file này (không đổi gì khác khi đo lại).