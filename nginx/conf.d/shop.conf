map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream backend {
    zone backend 64k;
    least_conn;                      # phải đứng trước keepalive
    server backend-1:3000 max_fails=3 fail_timeout=10s resolve;
    server backend-2:3000 max_fails=3 fail_timeout=10s resolve;
    # server backend-3:3000 max_fails=3 fail_timeout=10s resolve;   # chỉ khi thử profile scale3
    keepalive 16;
}

server {
    listen 8080;                     # container chạy user nginx nên không bind được cổng < 1024; compose map 80:8080
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;        # 5 ảnh x 2 MB = 10 MB mỗi request upload

    # ModSecurity + CRS; chế độ do biến MODSEC_RULE_ENGINE của image quyết định.
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # Ngày 4: limit_req cho /api/auth/login.

    location = /nginx-health {
        modsecurity off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/socket.io/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        add_header X-Upstream $upstream_addr always;   # ngày 3 gỡ
    }

    location /assets/ {
        modsecurity off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }
}