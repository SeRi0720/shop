map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream backend {
    zone backend 64k;
    least_conn;                      # phải đứng trước keepalive
    server backend-1:3000 max_fails=3 fail_timeout=10s resolve;
    server backend-2:3000 max_fails=3 fail_timeout=10s resolve;
    # server backend-3:3000 max_fails=3 fail_timeout=10s resolve;   # chỉ khi thử profile scale3
    keepalive 16;
}

# Cổng 80 (trong container 8080): chỉ chuyển hướng, trừ healthcheck
server {
    listen 8080;
    server_name _;
    modsecurity off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;                 # compose map 443:8443
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;

    ssl_certificate     /etc/nginx/certs/shop.pem;
    ssl_certificate_key /etc/nginx/certs/shop-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;

    # Cấp server: phủ 403/404/502 và mọi location không có add_header riêng
    include /etc/nginx/snippets/security-headers.conf;

    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # Ngày 4: limit_req cho /api/auth/login.

    location /api/socket.io/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;   # đã gỡ X-Upstream (QĐ 9)
    }

    location /assets/ {
        modsecurity off;
        include /etc/nginx/snippets/security-headers.conf;   # add_header ở đây thay thế cấp server
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }
}