# Template: entrypoint của image chạy envsubst (chỉ thay ${TEN_BIEN} đã định nghĩa) rồi ghi ra /etc/nginx/nginx.conf.
load_module modules/ngx_http_modsecurity_module.so;

worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;                  # chạy user nginx

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Chỉ nén tài sản tĩnh; không nén JSON của API.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time up=$upstream_addr urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # DNS nội bộ của Docker, cần cho `resolve` trong upstream.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    limit_req_zone $binary_remote_addr zone=login:10m rate=${LOGIN_RATE};
    limit_req_status 429;
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}