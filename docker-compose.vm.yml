# Compose cho máy ảo (demo và đo số liệu). Không phải production.
# backend-3 chỉ trong profile scale3 (thử một lần ở ngày 6).
name: shop-vm # project riêng: không dùng chung volume/container với docker-compose.yml (dev)

x-backend: &backend
  image: shop-backend:vm
  build:
    context: ./backend
    target: runtime
  restart: unless-stopped
  mem_limit: 512m
  env_file: .env
  volumes:
    - uploads:/app/uploads
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 512m
    command: ["postgres", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: shop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Không publish cổng 5432 ra ngoài.

  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    mem_limit: 1g # lớn hơn heap 512M vì còn bộ nhớ ngoài heap
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    # Không publish cổng 9092. Backend nối qua kafka:29092 (listener INTERNAL).

  redis:
    image: redis:8.8
    restart: unless-stopped
    mem_limit: 128m
    command:
      [
        "redis-server",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Không publish cổng 6379.

  backend-1:
    <<: *backend
    environment:
      KAFKA_CLIENT_ID: shop-backend-1

  backend-2:
    <<: *backend
    environment:
      KAFKA_CLIENT_ID: shop-backend-2

  backend-3:
    <<: *backend
    profiles: ["scale3"]
    environment:
      KAFKA_CLIENT_ID: shop-backend-3

    # Nginx + frontend. Cổng ra duy nhất của hệ thống.
  web:
    image: shop-web:vm
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    mem_limit: 384m # ModSecurity giữ thân request (upload tới 10 MB); đo lại ở bước 6
    ports:
      - "80:8080" # container chạy user nginx, cổng trong container là 8080
      - "192.168.99.144:443:8443" # IP LAN của VM (thay bằng IP thật của bạn)
      - "127.0.0.1:443:8443"
    environment:
      MODSEC_RULE_ENGINE: ${MODSEC_RULE_ENGINE:-DetectionOnly} # On | DetectionOnly | Off
      LOGIN_RATE: ${LOGIN_RATE:-5r/m}
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      # API dùng PATCH và DELETE; mặc định CRS chỉ cho GET HEAD POST OPTIONS.
      ALLOWED_METHODS: "GET HEAD POST PUT PATCH DELETE OPTIONS"
      # Audit log JSON vào volume, không ghi thân request và response (xem bước 5).
      MODSEC_AUDIT_LOG: /var/log/modsec/audit.log
      MODSEC_AUDIT_LOG_PARTS: "AHZ"
    volumes:
      - waf_logs:/var/log/modsec
      - ./nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Chạy một lần: áp migration và seed (admin + sản phẩm mẫu).
  # docker compose -f docker-compose.vm.yml --profile setup run --rm migrate
  migrate:
    image: shop-backend-migrate:vm
    profiles: ["setup"]
    build:
      context: ./backend
      target: build # tầng build có Prisma CLI và tsx
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"

volumes:
  postgres_data:
  kafka_data:
  uploads:
  waf_logs:
